# competitive-verifier (oj-resolve) の設定。
#
# 依存解決は `cargo metadata` をもとにパッケージ単位で行われるため、
# kind = "none" だと verify パッケージの全バイナリが、そのパッケージが
# 依存する全ライブラリクレートに依存していることになってしまう。
# ("Depends on" と "Verified with" に無関係なファイルが並ぶ)
#
# "cargo-udeps" にすると、バイナリごとに `cargo udeps --bin <name>` を実行して
# 未使用の依存を取り除くため、実際に使っているクレートだけが依存として残る。
# 代わりに nightly ツールチェインと cargo-udeps が必要になるので、
# verify ワークフローの解決ジョブでそれらを用意している。
#
# なお cargo-udeps はマクロ経由やドキュメントテストからの利用を検出できず、
# 使っている依存を「未使用」と誤判定することがある。その場合は該当クレートの
# Cargo.toml に `package.metadata.cargo-udeps.ignore` を書いて除外する。
[languages.rust.list_dependencies_backend]
kind = "cargo-udeps"
