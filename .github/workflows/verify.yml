name: verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      ignore_prev_result:
        description: 前回の検証結果を無視してすべて検証し直す
        type: boolean
        default: false

# GitHub Pages へのデプロイと PR へのコメント投稿に必要な権限。
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

# ブランチ・PR ごとに検証が並行して走るように、リファレンスごとにグループを分ける。
# 同じリファレンスへの再実行は直前の実行をキャンセルする。
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  setup:
    name: 検証対象の解決
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up competitive-verifier
        uses: competitive-verifier/actions/setup@v2
        with:
          cache-pip: true

      # oj-resolve は依存解決のために `cargo metadata` と
      # `cargo check --workspace --all-targets` を実行するため、
      # 解決の段階でも Rust ツールチェインが必要になる。
      #
      # さらに config.toml で list_dependencies_backend に "cargo-udeps" を
      # 指定しているため、`rustup run nightly cargo udeps` が動く必要がある。
      # dtolnay/rust-toolchain は入れたツールチェインを default にするので、
      # stable を後ろに置いて default を stable のままにしておく。
      - uses: dtolnay/rust-toolchain@nightly
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-udeps
      - uses: Swatinem/rust-cache@v2

      - name: oj-resolve
        uses: competitive-verifier/actions/oj-resolve@v2
        with:
          output-path: verify_files.json
          include: |
            crates
            verify
          # ユニットテストは検証対象のライブラリではないので、結果ページに載せない。
          exclude: |
            crates/*/src/tests.rs
          config: .competitive-verifier/config.toml

      - name: Upload verify_files.json
        uses: competitive-verifier/actions/upload-verify-artifact@v2
        with:
          file: verify_files.json

  verify:
    name: 検証 (${{ matrix.index }})
    runs-on: ubuntu-latest
    needs: [setup]
    env:
      # 問題が増えて 1 ジョブあたりの時間が伸びてきたら、
      # この値と matrix.index の要素数を一緒に増やす。
      SPLIT_SIZE: 4
    strategy:
      fail-fast: false
      matrix:
        index: ["0", "1", "2", "3"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 前回の検証結果。ライブラリのソースが変わっていない問題はスキップされる。
      - name: Restore cached results
        if: ${{ ! inputs.ignore_prev_result }}
        uses: actions/cache/restore@v6
        id: restore-cached-results
        with:
          path: ${{ github.workspace }}/merged-result.json
          key: ${{ runner.os }}-verify-result-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-verify-result-

      - name: Download verify_files.json
        uses: competitive-verifier/actions/download-verify-artifact@v2

      - name: Set up competitive-verifier
        uses: competitive-verifier/actions/setup@v2
        with:
          cache-pip: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify
        uses: competitive-verifier/actions/verify@v2
        with:
          destination: ${{ runner.temp }}/result.json
          split-size: ${{ env.SPLIT_SIZE }}
          split-index: ${{ matrix.index }}
          timeout: 1800
          prev-result: ${{ steps.restore-cached-results.outputs.cache-hit && 'merged-result.json' || '' }}
        env:
          # yukicoder のテストケース取得には API トークンが必要。
          # https://yukicoder.me/my/page の API キーを、リポジトリのシークレット
          # YUKICODER_TOKEN に登録しておく。
          YUKICODER_TOKEN: ${{ secrets.YUKICODER_TOKEN }}

      - name: Upload result artifact
        uses: actions/upload-artifact@v7
        with:
          name: Result-${{ runner.os }}-${{ matrix.index }}
          path: ${{ runner.temp }}/result.json
          retention-days: 1

  docs-and-check:
    name: ページ生成と結果判定
    runs-on: ubuntu-latest
    needs: [verify]
    outputs:
      upload-pages: ${{ steps.upload-pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download verify_files.json and all artifacts
        id: all-artifacts
        uses: competitive-verifier/actions/download-verify-artifact@v2
        with:
          download-all: true
          artifact-root: .artifacts/

      - name: Set up competitive-verifier
        uses: competitive-verifier/actions/setup@v2
        with:
          cache-pip: true

      - name: Merge results
        uses: competitive-verifier/actions/merge-result@v2
        with:
          result-files: ${{ steps.all-artifacts.outputs.artifacts-root }}/Result-*/result.json
          output-path: ${{ github.workspace }}/merged-result.json

      # コメント用のサマリーをファイルに書き出す。
      # GITHUB_STEP_SUMMARY はランナーが管理する変数で上書きが無視されるため、
      # コマンドが書き込んだランナー側のサマリーファイルをコピーして使う。
      - name: Generate verify summary for PR comment
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          competitive-verifier merge-result "${{ github.workspace }}/merged-result.json" \
            --write-summary
          cp "$GITHUB_STEP_SUMMARY" "${{ runner.temp }}/verify-summary.md"
          # 中身が空のままだとコメントが黙ってスキップされるので、ここで失敗させる。
          test -s "${{ runner.temp }}/verify-summary.md"

      - name: Docs
        uses: competitive-verifier/actions/docs@v2
        with:
          verify-result: ${{ github.workspace }}/merged-result.json
          destination: _jekyll
          write-summary: true
          include: |
            crates
            verify
          # setup の oj-resolve と同じ除外を指定する。
          exclude: |
            crates/*/src/tests.rs

      # 次回の実行で --prev-result として使う。
      # フォークからの PR ではキャッシュを書き込めないためスキップする。
      - name: Save result
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/merged-result.json
          key: ${{ runner.os }}-verify-result-${{ github.sha }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # `/` に検証状況ページ、`/book/` に mdBook を置いた 1 つの成果物にまとめる。
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: _jekyll
          destination: _site

      # jekyll-build-pages は Docker コンテナ内の root として動くため、
      # 生成された _site も root 所有になる。後続の mdbook が書き込めるようにする。
      - name: Take ownership of the Jekyll output
        run: sudo chown -R "$(id -u):$(id -g)" _site

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.4"

      - name: Build book
        # --dest-dir はカレントディレクトリからの相対パスとして解決される。
        run: mdbook build book --dest-dir _site/book

      - name: Upload artifact
        id: upload-pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # 検証に失敗した問題があればここでワークフローを失敗させる。
      # ページのアップロードより後に置くことで、失敗時も結果ページは公開される。
      - name: Check
        uses: competitive-verifier/actions/check@v2
        with:
          verify-result: ${{ github.workspace }}/merged-result.json

      # PR には検証結果のサマリーをコメントとして投稿する。
      # 失敗したときこそコメントが欲しいので always() にする。
      # フォークからの PR は GITHUB_TOKEN にコメント権限がないため対象外。
      - name: Post verify result comment
        uses: marocchino/sticky-pull-request-comment@v3
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          header: competitive-verifier
          path: ${{ runner.temp }}/verify-summary.md
          ignore_empty: true

  deploy:
    name: GitHub Pages へデプロイ
    if: (success() || failure()) && github.ref == 'refs/heads/main' && needs.docs-and-check.outputs.upload-pages == 'true'
    needs: docs-and-check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
