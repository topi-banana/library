[workspace]
resolver = "3"
members = ["crates/*", "verify"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/topi-banana/library"
license = "CC0-1.0"
publish = false

[workspace.dependencies]
permutation = { path = "crates/permutation" }
proconio = "0.6.0"
rle = { path = "crates/rle" }

[workspace.lints.clippy]
must_use_candidate = "allow"

[workspace.lints.rust]
missing_docs = "allow"

# verify で実際にジャッジに投げるバイナリは最適化して動かす。
[profile.release]
lto = "thin"
